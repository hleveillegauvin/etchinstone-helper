<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragons of Etchinstone - Setup Randomizer</title>
  <style>
    /* Dark theme styling inspired by modern web apps */
    :root {
      --bg: #12181b;
      --card-bg: #1a232a;
      --accent: #e56b6f;
      --text: #f0f4f8;
      --subtext: #9fb3c8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .setup-box {
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      text-align: left;
    }

    .setup-item {
      margin-bottom: 12px;
    }

    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--subtext);
    }

    .value {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 2px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    button:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Dragons of Etchinstone</h1>
    <p style="color: var(--subtext); font-size: 0.9rem;">Starting Setup Generator</p>

    <div class="setup-box">
      <div class="setup-item">
        <div class="label">Target Dragon</div>
        <div class="value" id="dragon">Click Generate</div>
      </div>
      <div class="setup-item">
        <div class="label">Starting Region</div>
        <div class="value" id="region">Click Generate</div>
      </div>
      <div class="setup-item" style="margin-bottom: 0;">
        <div class="label">First Card Orientation</div>
        <div class="value" id="orientation">Click Generate</div>
      </div>
    </div>

    <button onclick="generateSetup()">Randomize Setup</button>
  </div>

  <script>
    // Game Setup Options
    const dragons = ["Ashwing (Red)", "Frostbite (Blue)", "Gloomfang (Purple)", "Verdant (Green)"];
    const regions = ["Northvale", "Sunken Reach", "Whispering Woods", "Ironcrag"];
    const orientations = ["Level 2 (Upright)", "Level 2 (Inverted)"];

    function generateSetup() {
      // Pick random items from arrays
      const randomDragon = dragons[Math.floor(Math.random() * dragons.length)];
      const randomRegion = regions[Math.floor(Math.random() * regions.length)];
      const randomOrientation = orientations[Math.floor(Math.random() * orientations.length)];

      // Update HTML elements
      document.getElementById("dragon").innerText = randomDragon;
      document.getElementById("region").innerText = randomRegion;
      document.getElementById("orientation").innerText = randomOrientation;
    }
  </script>
</body>
</html>
